<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="Content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<script>{JS}</script>

	<link href="{CDNURL}/style/order.css" rel="stylesheet" type="text/css">
	<link href="{CDNURL}/style/share_tool.css" rel="stylesheet" type="text/css">

	<link rel="stylesheet" href="../../style/reset.css">
	<link rel="stylesheet" href="../../style/bonus.css">
	<title></title>

</head>

<body>
	<div class="bonus_wrap dark">
		<div  class="bonus_container _histroy">
			<div id="bonus_model" class="bonus_container _histroy">
				<div class="bonus_table _wager">
					<div class="bonus_table_title">
						<button id="backpage" class="btn_tool_back minimouse_hover">
							<i><svg><use xlink:href="#icon_backbtn"></use></svg></i>
						</button>
						*ART_hisbonus_history*｜*ART_hisbonus_date* <span>*DATETIME*</span>
					</div>
					<div class="bonus_table_head _rwdTb">
						<table>
	
							<tr>
								<th>*ART_hisbonus_vendor_code*</th>
								<th>*ART_hisbonus_activity_code*</th>
								<th>*ART_hisbonus_activity_name*</th>
								<th>*ART_hisbonus_giving_time*</th>
								<th>*ART_hisbonus_bonus_amount*</th>
							</tr>
						</table>
					</div>
					<div class="bonus_table_body _rwdTb _wager">
						<table>
							<tr>
								<td data-txt="*ART_hisbonus_vendor_code*">*WID*</td>
								<td data-txt="*ART_hisbonus_activity_code*">*RID*</td>
								<td data-txt="*ART_hisbonus_activity_name*">*RNAME*</td>
								<td data-txt="*ART_hisbonus_giving_time*">*SDATE* <br>*STIME*</td>
								<td class="coin" data-txt="*ART_hisbonus_bonus_amount*">*GOLD*</td>
							</tr>
						</table>
					</div>
				</div>
			</div>
		</div>

		<!-- 單開此頁icon_all不載入時 svg暫時放置處 -->

			</svg>
		</div>
	</div>
</body>

</html>
